controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true

diff_drive_controller:
  ros__parameters:
    left_wheel_names:
      - wheel_lhs_front_joint
      - wheel_lhs_mid_joint
      - wheel_lhs_rear_joint
    right_wheel_names:
      - wheel_rhs_front_joint
      - wheel_rhs_mid_joint
      - wheel_rhs_rear_joint
    base_frame_id: base_footprint
    wheel_separation: 0.61
    wheel_radius: 0.1
    linear.x.has_velocity_limits: true
    linear.x.max_velocity: 1.0
    angular.z.has_velocity_limits: true
    angular.z.max_velocity: 2.0
    use_sim_time: true

arm_controller:
  ros__parameters:
    joints:
      - arm_joint_0
      - arm_joint_1
      - arm_joint_2
      - arm_joint_3
      - arm_joint_4
      - arm_joint_5
    command_interfaces:
      - position
    state_interfaces:
      - position
    allow_partial_joints_goal: false
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    use_sim_time: true
